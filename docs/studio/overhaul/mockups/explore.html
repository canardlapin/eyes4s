<!doctype html>
<html><head><meta charset="utf-8"><title>Explore</title>
<link rel="stylesheet" href="es.css">
<script src="data.js"></script><script src="es.js"></script>
</head><body>
<script>
(function () {
  const KEY = 'P17 enc_03', SEL = 6;
  const fix = ES.fixations(KEY);
  const deg = f => [(f.x - 512) / 35, (384 - f.y) / 35];
  const dfmt = v => (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(1) + '°';

  // ── navigator: the trials of the pair this drill came from ──
  const ctl = FX.controls['2'].slice().sort((a, b) => b[2] - a[2]);
  const trow = (g, t, item, val, sel) => `<div class="li row${sel ? ' sel focusring' : ''}" style="height:26px">${g}<span class="${sel ? 'medium' : ''}" style="width:46px">${t}</span><span class="${sel ? '' : 'muted'}">${item}</span><span class="val small num ${sel ? '' : 'muted'}">${val}</span></div>`;
  let nav = `<div class="grouphead row" style="height:24px">Query</div>` + trow(ES.glyph.query(), 'ret_07', 'blank + cross', '12 fix');
  nav += `<div class="grouphead row" style="height:24px">Matched reference</div>` + trow(ES.glyph.match(), 'enc_03', 'beach-042', '0.94', true);
  nav += `<div class="grouphead row" style="height:24px">Controls · cosine at σ 2°</div>` + ctl.slice(0, 17).map(c => trow(ES.glyph.control(), c[1], c[0], c[2].toFixed(2))).join('');
  const navPane = `
  <div class="pane" style="width:248px;flex:none">
    <div class="ph row"><span class="title">Trials in this pair</span><span class="grow"></span><span class="small muted">21</span></div>
    <div class="list grow scrollwrap">${nav}<span class="thumb" style="top:0;height:86%"></span></div>
    <div class="row small muted" style="height:32px;padding:0 14px;border-top:1px solid var(--hairline);gap:6px">rows 1–19 of 21<span class="grow"></span><span class="link">All P17 trials</span></div>
  </div>`;

  // ── stage ──
  const W = 836, H = 372;
  const st = ES.stage({ key: KEY, role: 'match', display: 'image', image: 'img/beach-042.png', w: W, h: H, layers: { map: true, order: true, points: true }, sigma: 2, selected: SEL });
  const stagePane = `
  <div class="pane" style="flex:none">
    <div class="ph row"><span class="title">P17 · enc_03</span><span class="sub">run 7 map · σ 2°, 35 px/° declared</span><span class="grow"></span>
      ${ES.tog('Points', true)}${ES.tog('Order', true)}${ES.tog('Map', true)}
      ${ES.addToFigure}<div class="seg"><button class="on">Plot</button><button>Table</button></div><button class="ibtn" aria-label="Open in its own window">${ES.icon.popout}</button></div>
    <div class="stage" style="height:${H}px;margin:0 14px">${st.svg}</div>
    <div class="legend row" style="height:32px;padding:0 14px;gap:12px">
      <span class="it row">${ES.glyph.match()}fixation, area shows duration</span><span class="it row"><svg width="14" height="14"><circle cx="7" cy="7" r="3" fill="none" stroke="var(--ink)" stroke-width="1.5"/><circle cx="7" cy="7" r="6" fill="none" stroke="var(--ink)" stroke-width="1.5"/></svg>selected</span>
      <span class="it row"><svg width="10" height="10"><circle cx="5" cy="5" r="4" fill="none" stroke="var(--ink-3)" stroke-dasharray="2 2"/></svg>outside window</span>
      <span class="it row"><svg width="16" height="8"><path d="M1 4h14" stroke="var(--ink-3)"/></svg>order, not saccades</span>
      ${ES.mapLegend('', false)}
    </div>
  </div>`;

  // ── timeline: one bar per fixation over trial time ──
  const TW = 836, t1 = Math.max(...fix.map(f => f.onset + f.dur)) + 200, tx = t => 14 + t / t1 * (TW - 28);
  let tl = '';
  for (let s = 0; s <= t1; s += 500) tl += `<path d="M${tx(s)} 6V40" stroke="var(--plot-grid)"/>` + (s % 1000 === 0 ? `<text x="${tx(s)}" y="54" font-size="10" text-anchor="middle" fill="var(--ink-3)">${s / 1000} s</text>` : '');
  tl += `<rect x="${tx(1200)}" y="6" width="${tx(2800) - tx(1200)}" height="34" fill="var(--surface-3)"/>`;
  for (const f of fix) {
    const on = f.ord === SEL;
    tl += `<rect x="${tx(f.onset).toFixed(1)}" y="${on ? 12 : 16}" width="${(tx(f.onset + f.dur) - tx(f.onset) - 1).toFixed(1)}" height="${on ? 22 : 14}" fill="${f.inWin ? (on ? 'var(--ink-2)' : 'var(--hairline-strong)') : 'none'}" stroke="${f.inWin ? 'none' : 'var(--ink-3)'}" stroke-dasharray="2 2" rx="1"/>`;
  }
  tl += `<path d="M${tx(2160)} 2V44" stroke="var(--accent)" stroke-width="1.5"/>`;
  const timelinePane = `
  <div class="pane" style="flex:none">
    <div class="ph row"><span class="title">Timeline</span><span class="sub">13 fixations · brush 1.20–2.80 s highlights fixations; the analysis is unchanged</span><span class="grow"></span>
      <button class="ibtn" aria-label="Step back">${ES.icon.stepb}</button><button class="ibtn" aria-label="Play">${ES.icon.play}</button><button class="ibtn" aria-label="Step forward">${ES.icon.step}</button>
      <div class="seg"><button>0.5×</button><button class="on">1×</button><button>2×</button></div></div>
    <div style="padding:0 14px 8px" tabindex="0" role="slider" aria-label="Trial time; arrow keys step fixations"><svg width="${TW}" height="58" style="display:block">${tl}</svg></div>
  </div>`;

  // ── source records ──
  let rows = '';
  for (const f of fix.slice(3, 9)) {
    const [dx, dy] = deg(f), on = f.ord === SEL;
    rows += `<tr class="${on ? 'sel' : ''}"><td class="r num">${(7208 + f.ord).toLocaleString('en-US')}</td><td class="r num">${f.ord}</td><td class="r num">${f.onset.toLocaleString('en-US')}</td><td class="r num">${f.dur}</td><td class="r num">${f.sx.toFixed(1)}, ${f.sy.toFixed(1)}</td><td class="r num">${Math.round(f.x)}, ${Math.round(f.y)}</td><td class="r num">${dfmt(dx)}, ${dfmt(dy)}</td><td class="r num">${f.n}</td><td>${f.inWin ? 'inside' : '<span class="tag neutral">outside</span>'}</td></tr>`;
  }
  const recPane = `
  <div class="pane grow">
    <div class="ph row"><span class="title">Source records</span><span class="sub">fixations.csv · enc_03 · rows 4–9 of 13</span><span class="grow"></span><button class="btn sm">Show raw record</button></div>
    <div style="padding:0 8px" tabindex="0" role="grid" aria-label="Source records"><table class="t"><tr><th class="r">Record</th><th class="r">Fixation</th><th class="r">Onset ms</th><th class="r">Dur ms</th><th class="r">Screen px</th><th class="r">Image px</th><th class="r">Degrees</th><th class="r">Samples</th><th>Window</th></tr>${rows}</table></div>
  </div>`;

  // ── inspector ──
  const f6 = fix.find(f => f.ord === SEL), [gx, gy] = deg(f6);
  const insp = `
  <div class="pane" style="width:300px;flex:none">
    <div class="ph row"><span class="title">Fixation 6 of 13</span><span class="grow"></span><span class="small muted">read-only</span>${ES.closeInspector}</div>
    <div class="section" style="padding-top:4px">
      <div class="kv">
        <span class="k">Onset</span><span class="v num">2,160 ms</span>
        <span class="k">Duration</span><span class="v num">${f6.dur} ms</span>
        <span class="k">Image px</span><span class="v num">${Math.round(f6.x)}, ${Math.round(f6.y)}</span>
        <span class="k">Degrees</span><span class="v num">${dfmt(gx)}, ${dfmt(gy)}</span>
        <span class="k">Window</span><span class="v">inside</span>
      </div>
      <div class="small muted" style="margin-top:10px">Degrees from the image centre, x right, y up, at a declared 35 px/° (not calibrated).</div>
    </div>
    <div class="section">
      <div class="sh row">Source</div>
      <div class="kv">
        <span class="k">File</span><span class="v">fixations.csv</span>
        <span class="k">Record</span><span class="v num">7,214 of 11,520</span>
        <span class="k">Admission</span><span class="v">admitted · dataset r3</span>
      </div>
    </div>
    <div class="section">
      <div class="sh row">Used by run 7 at σ 2°</div>
      <div class="col" style="gap:8px;font-size:12px">
        <span class="row" style="gap:8px">${ES.glyph.match()}<span class="link">ret_07 · matched reference</span></span>
        <span class="row" style="gap:8px">${ES.glyph.control()}<span class="link">18 pairs as a control</span></span>
      </div>
    </div>
  </div>`;

  ES.mount({
    persp: 'Results',
    trail: ['Summary', 'Remembered', 'P17', 'ret_07 × enc_03', 'Matched trial', 'Fixation 6'],
    work: navPane + `<div class="stack grow">${stagePane}${timelinePane}${recPane}</div>` + insp,
    statusHint: 'Arrows move between fixations · Enter selects',
  });
})();
</script>
</body></html>
