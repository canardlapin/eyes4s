<!doctype html>
<html><head><meta charset="utf-8"><title>State menu</title>
<link rel="stylesheet" href="es.css">
<script src="data.js"></script><script src="es.js"></script>
</head><body>
<script>
// The study-wide state button's menu (JavaFX: a Popup anchored under the button), in three states.
// Not a scored specimen.
(function () {
  ES.mount({
    persp: 'Results',
    trail: ['Summary · by retrieval response'],
    work: `<div class="pane grow"></div>`,
    statusHint: 'Esc closes the menu',
  });
  const dot = c => `<span style="display:inline-block;width:8px;height:8px;border-radius:4px;background:${c}"></span>`;
  const draft = `${ES.draftmark}`;
  const menu = (left, title, html) => {
    const m = document.createElement('div');
    m.className = 'col popup';
    m.style.cssText = `position:absolute;left:${left}px;top:96px;width:440px;background:var(--surface);border:1px solid var(--hairline-strong);border-radius:8px`;
    m.innerHTML = `<div class="small muted" style="padding:6px 14px;border-bottom:1px solid var(--hairline)">${title}</div>` + html;
    document.body.appendChild(m);
  };
  const sec = (head, body) => `<div class="section col" style="gap:8px"><span class="row medium" style="gap:8px">${head}</span>${body}</div>`;

  menu(16, 'Idle (t2): "Run 7 · current | Data r3 | Analysis rev 5 · not run"',
    sec(`${dot('var(--accent)')}Run 7 · current`, `<div class="kv"><span class="k">Analysis</span><span class="v">rev 4 · cosine · σ 0.5°, 1°, 2°, 4°</span><span class="k">Pair rows</span><span class="v num">35,876</span></div>`) +
    sec('Dataset r3 · admitted', `<div class="kv"><span class="k">Trials</span><span class="v num">937 of 960 admitted</span><span class="k">Changed from r2</span><span class="v">4 trials change status</span></div><div class="row" style="gap:8px"><button class="btn sm">Open in Data</button></div>`) +
    sec(`${draft}Analysis rev 5 · not run`, `<span class="small ink2">Adds σ 8°; 44,845 pair rows. Results and figures stay on run 7 until rev 5 runs and you show it.</span><div class="row" style="gap:8px"><button class="btn sm">Review in Analysis</button><button class="btn sm">Save and run</button><span class="grow"></span><button class="btn quiet sm" style="color:var(--fail)">Discard draft</button></div>`) +
    sec('Jobs', `<span class="small muted">None running · run 6 was cancelled at Comparing</span>`));

  menu(496, 'Running (t3): "Showing run 7 | Data r3 | Run 8 · comparing …" ✕',
    sec(`${dot('var(--ink-3)')}Showing run 7`, `<span class="small ink2">rev 4 · data r3 · 35,876 pair rows</span>`) +
    sec('Dataset r3 · admitted', `<span class="small muted">937 of 960 trials</span>`) +
    sec(`${draft}Analysis rev 5 · running as run 8`, `<span class="small muted">Edits make rev 6; run 8 keeps rev 5.</span>`) +
    sec('Jobs', `<span class="medium" style="font-size:12px">Run 8 · rev 5 · comparing</span><div class="row" style="gap:10px"><span class="bar" style="width:240px"><i style="width:48%"></i></span><span class="small num">21,400 / 44,845 pairs</span></div>
      <span class="small ink2">Elapsed 4:12 · adds σ 8°; this view stays on run 7 until you choose.</span>
      <div class="row">${ES.tog('Show run 8 here when it finishes', false)}<span class="grow"></span><button class="btn sm">Cancel run 8…</button></div>`));

  menu(976, 'Confirm (✕ or ⌘. while no dialog is open)',
    sec('Cancel run 8?', `<span class="small ink2">21,400 of 44,845 pairs are done. Run 7 stays shown.</span>
      <div class="row" style="gap:8px"><span class="grow"></span><button class="btn sm" style="color:var(--fail);border-color:var(--fail)">Cancel run</button><button class="btn primary sm" style="outline:2px solid var(--focus);outline-offset:2px">Keep running</button></div><span class="small muted">Enter or Esc keeps it running.</span>`) +
    sec('After cancelling', `<div class="row small" style="gap:10px;padding:8px 10px;border-radius:6px;background:var(--surface-2)"><span>Run 8 cancelled at Comparing</span><span class="grow"></span><button class="btn quiet sm">Run rev 5 again</button></div><span class="small muted">The notice replaces the state button for 8 s and pauses while hovered or focused; then the button returns to "Run 7 · current | Data r3 | Analysis rev 5 · not run". The Jobs section keeps "Run 8 cancelled at Comparing · Run rev 5 again".</span>`));
  const rule = document.createElement('div');
  rule.className = 'small ink2';
  rule.style.cssText = 'position:absolute;left:16px;bottom:44px;width:1400px';
  rule.innerHTML = '<span class="medium">Slot rule.</span> The state button always has three slots: Run · Data · Analysis. A slot carries a qualifier only when it differs from the shown run. While a job runs, the Run slot reads "Showing run N" and the Analysis slot shows the job; a separate 28 px ✕ cancels it (⌘. too, never while a dialog is open). Menus list Run, Dataset, Analysis, Jobs in every state. On narrow windows the button drops, in order, the pair count, then "Data r3", then shortens "Showing run 7" to "Run 7"; minimum window width 1,080 px.';
  document.body.appendChild(rule);
})();
</script>
</body></html>
