<!doctype html>
<html><head><meta charset="utf-8"><title>spike</title>
<style>
@font-face { font-family: Plex; src: url(fonts/IBMPlexSans-Regular.ttf); font-weight: 400; }
@font-face { font-family: Plex; src: url(fonts/IBMPlexSans-Medium.ttf); font-weight: 500; }
@font-face { font-family: Plex; src: url(fonts/IBMPlexSans-SemiBold.ttf); font-weight: 600; }
html, body { margin: 0; width: 800px; height: 460px; overflow: hidden; background: #FBFAF8; }
</style></head><body>
<svg id="s" width="800" height="460" style="display:block"></svg>
<script>
// Same geometry as FidelitySpikeFxSuite.scala, drawn by Chromium.
const S = 'Remembered − Forgotten +0.62 · σ 2° · 35 px/° · P17 ret_07';
let h = '', row = 0;
for (const w of [400, 500, 600]) for (const z of [11, 12, 13, 15]) { h += `<text x="24" y="${30 + row * 24}" font-family="Plex" font-weight="${w}" font-size="${z}" fill="#1C1E21">${S}</text>`; row++; }
h += `<text x="24" y="340" font-family="Plex" font-weight="500" font-size="34" fill="#1C1E21">+0.62</text>`;
const RAMP = [[0xB0, 0x60, 0x9C], [0x8E, 0x3E, 0x7E], [0x6E, 0x23, 0x66], [0x4A, 0x0C, 0x47]];
const ramp = t => { t = Math.max(0, Math.min(1, t)); const at = t * 3, k = Math.min(2, Math.floor(at)), f = at - k; return [0, 1, 2].map(i => Math.round(RAMP[k][i] + (RAMP[k + 1][i] - RAMP[k][i]) * f)); };
const bumps = [[14, 12, 6, 1], [44, 16, 8, 0.8], [30, 34, 5, 0.6]];
const g = []; let max = 0;
for (let j = 0; j < 48; j++) { const r = []; for (let i = 0; i < 64; i++) { let v = 0; for (const [x, y, s, w] of bumps) v += w * Math.exp(-((i - x) ** 2 + (j - y) ** 2) / (2 * s * s)); r.push(v); max = Math.max(max, v); } g.push(r); }
const c = document.createElement('canvas'); c.width = 64; c.height = 48; const ctx = c.getContext('2d'), im = ctx.createImageData(64, 48);
for (let j = 0; j < 48; j++) for (let i = 0; i < 64; i++) { const t = g[j][i] / max, [r, gg, b] = ramp(t), a = Math.min(1, t / 0.25) * 0.75, k = (j * 64 + i) * 4; im.data.set([r, gg, b, Math.round(a * 255)], k); }
ctx.putImageData(im, 0, 0);
h += `<rect x="420" y="20" width="360" height="270" fill="#808080"/><image href="${c.toDataURL()}" x="420" y="20" width="360" height="270" preserveAspectRatio="none" style="image-rendering:auto"/>`;
const pts = '440,260 500,120 560,200 640,80 700,150 760,240';
h += `<polyline points="${pts}" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"/><polyline points="${pts}" fill="none" stroke="rgba(28,30,33,.9)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>`;
h += `<rect x="24.5" y="360.5" width="120" height="28" rx="6" fill="#FBFAF8" stroke="#CBC6BC" stroke-width="1"/><text x="36" y="379" font-family="Plex" font-weight="500" font-size="12" fill="#1C1E21">Add to figure</text>`;
h += `<line x1="24" y1="420.5" x2="380" y2="420.5" stroke="#DEDAD2" stroke-width="1"/>`;
document.getElementById('s').innerHTML = h;
</script></body></html>
