# Each provider is a source-only pre-release repository. The default studio
# build resolves it as an ordinary library at version 0.0.0-<revision>, which
# studio/publish-pins.sh builds from exactly this commit and publishes to the
# local Ivy repository. Change a pin by editing its revision (a full 40-hex Git
# SHA), rerunning the script and running `sbt studioAll`. See studio/README.md.

