name: Checks

on:
  pull_request:
    branches: ['**', '!update/**', '!pr/**']
  push:
    branches: ['**', '!update/**', '!pr/**']

permissions:
  actions: none
  checks: none
  contents: read
  deployments: none
  id-token: none
  issues: none
  packages: none
  pages: none
  pull-requests: none
  repository-projects: none
  security-events: none
  statuses: none

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


concurrency:
  group: ${{ github.workflow }} @ ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test
    strategy:
      matrix:
        os: [ubuntu-22.04]
        scala: [3]
        java: [temurin@17, temurin@21]
        project: [rootJS, rootJVM]
        exclude:
          - project: rootJS
            java: temurin@21
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout current branch (full)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Setup Java (temurin@17)
        id: setup-java-temurin-17
        if: matrix.java == 'temurin@17'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: sbt

      - name: sbt update
        if: matrix.java == 'temurin@17' && steps.setup-java-temurin-17.outputs.cache-hit == 'false'
        run: sbt +update

      - name: Setup Java (temurin@21)
        id: setup-java-temurin-21
        if: matrix.java == 'temurin@21'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: sbt

      - name: sbt update
        if: matrix.java == 'temurin@21' && steps.setup-java-temurin-21.outputs.cache-hit == 'false'
        run: sbt +update

      - name: Check that workflows are up to date
        run: sbt githubWorkflowCheck

      - name: Check headers and formatting
        if: matrix.java == 'temurin@17' && matrix.os == 'ubuntu-22.04'
        run: sbt 'project ${{ matrix.project }}' '++ ${{ matrix.scala }}' headerCheckAll scalafmtCheckAll 'project /' scalafmtSbtCheck

      - name: scalaJSLink
        if: matrix.project == 'rootJS'
        run: sbt 'project ${{ matrix.project }}' '++ ${{ matrix.scala }}' Test/scalaJSLinkerResult

      - name: Test
        run: sbt 'project ${{ matrix.project }}' '++ ${{ matrix.scala }}' test

      - name: Check binary compatibility
        if: matrix.java == 'temurin@17' && matrix.os == 'ubuntu-22.04'
        run: sbt 'project ${{ matrix.project }}' '++ ${{ matrix.scala }}' mimaReportBinaryIssues

      - name: Generate API documentation
        if: matrix.java == 'temurin@17' && matrix.os == 'ubuntu-22.04'
        run: sbt 'project ${{ matrix.project }}' '++ ${{ matrix.scala }}' doc

      - name: Compile all modules
        run: sbt 'project ${{ matrix.project }}' '++ ${{ matrix.scala }}' compile

      - name: Run published law suites
        if: matrix.project == 'rootJVM' && matrix.java == 'temurin@17'
        run: sbt lawsJVM/test lawsJS/test

      - name: Check module and kernel boundaries
        run: sbt 'project ${{ matrix.project }}' '++ ${{ matrix.scala }}' checkBoundaries

      - name: Compile examples and build the public guide
        if: matrix.project == 'rootJVM' && matrix.java == 'temurin@17'
        run: sbt docs/tlSite

      - name: Check public documentation coverage (JVM evidence)
        if: matrix.project == 'rootJVM' && matrix.java == 'temurin@17'
        run: python3 tools/check-docs.py --platform jvm --skip-consumer

      - name: Check public documentation coverage (Scala.js evidence)
        if: matrix.project == 'rootJS' && matrix.java == 'temurin@17'
        run: python3 tools/check-docs.py --platform js --skip-consumer

      - name: Run EyeLink performance smoke court
        if: matrix.project == 'rootJVM' && matrix.java == 'temurin@17'
        run: sbt 'ioJVM/Test/runMain eyes4s.io.EyeLinkAscPerformanceMain --profile smoke --hardware github-actions-ubuntu-22.04-x64'

      - name: Run execution responsiveness smoke profile
        if: matrix.project == 'rootJVM' && matrix.java == 'temurin@17'
        run: sbt 'fs2ModuleJVM/Test/runMain eyes4s.fs2.ExecutionResponsivenessMain --profile smoke --hardware github-actions-ubuntu-22.04-x64'

  studio-linux:
    name: Studio (Linux, headless JavaFX)
    strategy:
      matrix:
        os: [ubuntu-22.04]
        java: [temurin@25]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout current branch (full)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Setup Java (temurin@25)
        id: setup-java-temurin-25
        if: matrix.java == 'temurin@25'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: sbt

      - name: sbt update
        if: matrix.java == 'temurin@25' && steps.setup-java-temurin-25.outputs.cache-hit == 'false'
        run: sbt +update

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14

      - name: Check the studio design fixture regenerates
        run: |
          tmp="$(mktemp -d)"
          (cd "$tmp" && python3 "$GITHUB_WORKSPACE/docs/studio/fixture/make_fixture.py" > /dev/null)
          diff -u docs/studio/fixture/FIXTURE.md "$tmp/FIXTURE.md"
          diff -u docs/studio/fixture/fixture.json "$tmp/fixture.json"

      - name: Check the studio acceptance fixture is current
        run: python3 tools/studio-fixture/generate.py --check

      - name: Verify studio fixture counts
        run: python3 tools/studio-fixture/verify_counts.py

      - name: Build and test studio (xvfb, software pipeline)
        run: xvfb-run -a -s '-screen 0 1920x1200x24' sbt -J-Xmx8g -Djavafx.platform=linux studioAll studioStyleCheck

      - name: Upload studio snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-snapshots-linux-${{ github.sha }}
          path: target/studio-snapshots/
          if-no-files-found: error

  studio-macos:
    name: Studio (macOS, functional JavaFX)
    strategy:
      matrix:
        os: [macos-latest]
        java: [temurin@25]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout current branch (full)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Setup Java (temurin@25)
        id: setup-java-temurin-25
        if: matrix.java == 'temurin@25'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: sbt

      - name: sbt update
        if: matrix.java == 'temurin@25' && steps.setup-java-temurin-25.outputs.cache-hit == 'false'
        run: sbt +update

      - name: Run functional JavaFX tests (no goldens)
        run: sbt -J-Xmx4g -Djavafx.platform=mac-aarch64 studioDesktop/test

  site:
    name: Generate Site
    strategy:
      matrix:
        os: [ubuntu-22.04]
        java: [temurin@17]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout current branch (full)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Setup Java (temurin@17)
        id: setup-java-temurin-17
        if: matrix.java == 'temurin@17'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: sbt

      - name: sbt update
        if: matrix.java == 'temurin@17' && steps.setup-java-temurin-17.outputs.cache-hit == 'false'
        run: sbt +update

      - name: Setup Java (temurin@21)
        id: setup-java-temurin-21
        if: matrix.java == 'temurin@21'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: sbt

      - name: sbt update
        if: matrix.java == 'temurin@21' && steps.setup-java-temurin-21.outputs.cache-hit == 'false'
        run: sbt +update

      - name: Generate site
        run: sbt docs/tlSite
