name: Studio

on:
  pull_request:
    branches: ['**', '!update/**', '!pr/**']
    paths: [studio/**, fixtures/studio-golden/**, fixtures/studio-bundles/**, tools/studio-fixture/**, tools/studio-e2e/**, tools/studio-visual-parity/**, docs/studio/fixture/**, build.sbt, project/**, .github/workflows/studio.yml, kernel/**, core/**, detect/**, surface/**, aoi/**, compare/**, design/**, plan/**, results/**, codec/**, fs2/**]
  push:
    branches: ['**', '!update/**', '!pr/**']
    paths: [studio/**, fixtures/studio-golden/**, fixtures/studio-bundles/**, tools/studio-fixture/**, tools/studio-e2e/**, tools/studio-visual-parity/**, docs/studio/fixture/**, build.sbt, project/**, .github/workflows/studio.yml, kernel/**, core/**, detect/**, surface/**, aoi/**, compare/**, design/**, plan/**, results/**, codec/**, fs2/**]

permissions:
  actions: none
  checks: none
  contents: read
  deployments: none
  id-token: none
  issues: none
  packages: none
  pages: none
  pull-requests: none
  repository-projects: none
  security-events: none
  statuses: none

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


concurrency:
  group: ${{ github.workflow }} @ ${{ github.ref }}
  cancel-in-progress: true

jobs:
  studio-linux:
    name: Studio (Linux, headless JavaFX)
    strategy:
      matrix:
        os: [ubuntu-22.04]
        java: [temurin@25]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout current branch (full)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Setup Java (temurin@25)
        id: setup-java-temurin-25
        if: matrix.java == 'temurin@25'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: sbt

      - name: sbt update
        if: matrix.java == 'temurin@25' && steps.setup-java-temurin-25.outputs.cache-hit == 'false'
        run: sbt +update

      - name: Publish the scaladock and Intaglio pins
        run: bash studio/publish-pins.sh

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14

      - name: Check the studio design fixture regenerates
        run: |
          tmp="$(mktemp -d)"
          (cd "$tmp" && python3 "$GITHUB_WORKSPACE/docs/studio/fixture/make_fixture.py" > /dev/null)
          diff -u docs/studio/fixture/FIXTURE.md "$tmp/FIXTURE.md"
          diff -u docs/studio/fixture/fixture.json "$tmp/fixture.json"

      - name: Check the studio acceptance fixture is current
        run: python3 tools/studio-fixture/generate.py --check

      - name: Verify studio fixture counts
        run: python3 tools/studio-fixture/verify_counts.py

      - name: Build and test studio (xvfb, software pipeline)
        run: xvfb-run -a -s '-screen 0 1920x1200x24' sbt -J-Xmx3g -Djavafx.platform=linux studioAll studioStyleCheck

      - name: Check studio resolved-graph boundaries
        run: sbt -J-Xmx4g -Djavafx.platform=linux studioBoundaries

      - name: Require all30 JavaFX golden states and executed cases
        run: |
          python3 -m unittest discover -s tools/studio-visual-parity -p 'test_*.py'
          python3 tools/studio-visual-parity/check.py

      - name: Qualify the E2E02–25 catalogue from executed reports
        run: |
          python3 -m unittest discover -s tools/studio-e2e -p 'test_*.py'
          python3 tools/studio-e2e/check.py

      - name: Upload studio snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-snapshots-linux-${{ github.sha }}
          path: |
            target/studio-snapshots/
            target/studio-e2e/
            target/studio-visual-parity/
            studio/**/target/test-reports/
          include-hidden-files: true
          if-no-files-found: warn

      - name: Require studio snapshots
        if: success()
        run: |
          if [ -z "$(find target/studio-snapshots -name '*.png' -print -quit 2>/dev/null)" ]; then
            echo '::error::no PNG under target/studio-snapshots: the FX snapshot tests wrote nothing'
            exit 1
          fi

  studio-linux-hidpi:
    name: Studio (Linux, native output scale 2)
    strategy:
      matrix:
        os: [ubuntu-22.04]
        java: [temurin@25]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Checkout current branch (full)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Setup Java (temurin@25)
        id: setup-java-temurin-25
        if: matrix.java == 'temurin@25'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: sbt

      - name: sbt update
        if: matrix.java == 'temurin@25' && steps.setup-java-temurin-25.outputs.cache-hit == 'false'
        run: sbt +update

      - name: Publish the scaladock and Intaglio pins
        run: bash studio/publish-pins.sh

      - name: Run all desktop tests on native GTK at scale 2
        run: |
          sbt -J-Xmx2g -Djavafx.platform=linux studioDesktop/Test/compile
          xvfb-run -a -s '-screen 0 3840x2400x24' sbt -J-Xmx1g -Djavafx.platform=linux -Deyes4s.studio.test.heap=4g -Deyes4s.studio.fx.visible=true -Dglass.gtk.uiScale=2 -Deyes4s.studio.fx.expectedOutputScale=2 studioDesktop/test

      - name: Require native scale, sharpness and raster receipt
        run: |
          python3 - <<'PY'
          import json, pathlib
          files = list(pathlib.Path('target/studio-snapshots/NativeOutputScaleFxSuite').rglob('native-output-scale.json'))
          assert len(files) == 1, 'native scale test did not write exactly one receipt'
          r = json.loads(files[0].read_text())
          assert r['nativeScaleX'] == r['nativeScaleY'] == r['requiredScale'] == 2, r
          assert r['hostOverride'] is False and r['stripeWidthDevicePixels'] == 1, r
          assert r['rasterDifferenceFraction'] <= r['maximumDifferenceFraction'] <= 0.005, r
          assert (files[0].parent / 'light-2x.png').is_file(), 'native scale snapshot missing'
          print('Verified native output-scale-2 raster receipt:', r)
          PY

      - name: Require all30 native GTK2 functional states
        run: python3 tools/studio-visual-parity/check.py --allow-functional-only

      - name: Upload native HiDPI snapshots and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-snapshots-linux-hidpi-${{ github.sha }}
          path: |
            target/studio-snapshots/
            studio/desktop/target/test-reports/
          if-no-files-found: warn

  studio-macos:
    name: Studio (macOS, functional JavaFX)
    strategy:
      matrix:
        os: [macos-15]
        java: [temurin@25]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout current branch (full)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Setup Java (temurin@25)
        id: setup-java-temurin-25
        if: matrix.java == 'temurin@25'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: sbt

      - name: sbt update
        if: matrix.java == 'temurin@25' && steps.setup-java-temurin-25.outputs.cache-hit == 'false'
        run: sbt +update

      - name: Publish the scaladock and Intaglio pins
        run: bash studio/publish-pins.sh

      - name: Run functional JavaFX tests (no goldens)
        env:
          EYES4S_STUDIO_SMALL_DISPLAY: skip
        run: |
          sbt -J-Xmx2g -Djavafx.platform=mac-aarch64 studioDesktop/Test/compile
          sbt -J-Xmx1g -Djavafx.platform=mac-aarch64 -Deyes4s.studio.test.heap=4g -Deyes4s.studio.fx.visible=true studioDesktop/test

      - name: Require all30 native macOS functional states
        run: python3 tools/studio-visual-parity/check.py --allow-functional-only

      - name: Upload macOS functional matrix and full Tab transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-snapshots-macos-${{ github.sha }}
          path: |
            target/studio-snapshots/VisualParitySuite/
            target/studio-snapshots/ParticipantsNavigatorFxSuite/
            target/studio-visual-parity/
            studio/desktop/target/test-reports/
          include-hidden-files: true
          if-no-files-found: warn

  studio-clean-clone:
    name: Studio pins from a clean clone
    strategy:
      matrix:
        os: [ubuntu-22.04]
        java: [temurin@25]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout current branch (full)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Setup Java (temurin@25)
        id: setup-java-temurin-25
        if: matrix.java == 'temurin@25'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: sbt

      - name: sbt update
        if: matrix.java == 'temurin@25' && steps.setup-java-temurin-25.outputs.cache-hit == 'false'
        run: sbt +update

      - name: Publish the scaladock and Intaglio pins
        run: bash studio/publish-pins.sh

      - name: Build studio through the local-checkout override
        run: sbt -J-Xmx6g -Djavafx.platform=linux -Dstudio.intaglio.local=target/studio-pins/intaglio-edcdfd5ffaf010e8205da04a85a7f8b6b2fd0d92 -Dstudio.scaladock.local=target/studio-pins/scaladock-b83a7ecb90529184bd75eb1ad0b322af73ec065f studioVizJVM/test studioVizJS/test studioDesktop/Test/compile studioDesktop/checkModuleBoundaries
