# This file is generated by the githubWorkflowGenerate task in build.sbt.
# Do not edit it directly.

name: Studio

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  studio-clean-clone:
    name: Studio from a clean clone
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout current revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: sbt

      - name: Publish the source pins at their recorded revisions
        run: bash studio/publish-pins.sh

      - name: Build and test studio against the pins
        run: sbt -J-Xmx6g studioAll checkBoundaries studioStyleCheck

      - name: Build studio against the local-checkout override
        run: >-
          env -u CI sbt -J-Xmx6g
          -Dstudio.intaglio.local=target/studio-pins/intaglio-2fa5c682f4a95b8e73daad78dd9302d7aff46e11
          -Dstudio.scaladock.local=target/studio-pins/scaladock-32ac3ca87d3728d88cdd9d694959dd6ff80b9ddb
          studioVizJVM/test studioVizJS/test studioDesktop/test studioDesktop/checkModuleBoundaries
