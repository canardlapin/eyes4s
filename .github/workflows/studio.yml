name: Studio

on:
  pull_request:
    branches: ['**', '!update/**', '!pr/**']
    paths: [studio/**, fixtures/studio-golden/**, fixtures/studio-bundles/**, tools/studio-fixture/**, docs/studio/fixture/**, build.sbt, project/**, .github/workflows/studio.yml, kernel/**, core/**, detect/**, surface/**, aoi/**, compare/**, design/**, plan/**, results/**, codec/**, fs2/**]
  push:
    branches: ['**', '!update/**', '!pr/**']
    paths: [studio/**, fixtures/studio-golden/**, fixtures/studio-bundles/**, tools/studio-fixture/**, docs/studio/fixture/**, build.sbt, project/**, .github/workflows/studio.yml, kernel/**, core/**, detect/**, surface/**, aoi/**, compare/**, design/**, plan/**, results/**, codec/**, fs2/**]

permissions:
  actions: none
  checks: none
  contents: read
  deployments: none
  id-token: none
  issues: none
  packages: none
  pages: none
  pull-requests: none
  repository-projects: none
  security-events: none
  statuses: none

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


concurrency:
  group: ${{ github.workflow }} @ ${{ github.ref }}
  cancel-in-progress: true

jobs:
  studio-linux:
    name: Studio (Linux, headless JavaFX)
    strategy:
      matrix:
        os: [ubuntu-22.04]
        java: [temurin@25]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout current branch (full)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Setup Java (temurin@25)
        id: setup-java-temurin-25
        if: matrix.java == 'temurin@25'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: sbt

      - name: sbt update
        if: matrix.java == 'temurin@25' && steps.setup-java-temurin-25.outputs.cache-hit == 'false'
        run: sbt +update

      - name: Publish the scaladock and Intaglio pins
        run: bash studio/publish-pins.sh

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14

      - name: Check the studio design fixture regenerates
        run: |
          tmp="$(mktemp -d)"
          (cd "$tmp" && python3 "$GITHUB_WORKSPACE/docs/studio/fixture/make_fixture.py" > /dev/null)
          diff -u docs/studio/fixture/FIXTURE.md "$tmp/FIXTURE.md"
          diff -u docs/studio/fixture/fixture.json "$tmp/fixture.json"

      - name: Check the studio acceptance fixture is current
        run: python3 tools/studio-fixture/generate.py --check

      - name: Verify studio fixture counts
        run: python3 tools/studio-fixture/verify_counts.py

      - name: Build and test studio (xvfb, software pipeline)
        run: xvfb-run -a -s '-screen 0 1920x1200x24' sbt -J-Xmx3g -Djavafx.platform=linux studioAll studioStyleCheck

      - name: Check studio resolved-graph boundaries
        run: sbt -J-Xmx4g -Djavafx.platform=linux studioBoundaries

      - name: Upload studio snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-snapshots-linux-${{ github.sha }}
          path: target/studio-snapshots/
          if-no-files-found: warn

      - name: Require studio snapshots
        if: success()
        run: |
          if [ -z "$(find target/studio-snapshots -name '*.png' -print -quit 2>/dev/null)" ]; then
            echo '::error::no PNG under target/studio-snapshots: the FX snapshot tests wrote nothing'
            exit 1
          fi

  studio-macos:
    name: Studio (macOS, functional JavaFX)
    strategy:
      matrix:
        os: [macos-15]
        java: [temurin@25]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout current branch (full)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Setup Java (temurin@25)
        id: setup-java-temurin-25
        if: matrix.java == 'temurin@25'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: sbt

      - name: sbt update
        if: matrix.java == 'temurin@25' && steps.setup-java-temurin-25.outputs.cache-hit == 'false'
        run: sbt +update

      - name: Publish the scaladock and Intaglio pins
        run: bash studio/publish-pins.sh

      - name: Run functional JavaFX tests (no goldens)
        env:
          EYES4S_STUDIO_SMALL_DISPLAY: skip
        run: |
          sbt -J-Xmx2g -Djavafx.platform=mac-aarch64 studioDesktop/Test/compile
          sbt -J-Xmx1g -Djavafx.platform=mac-aarch64 -Deyes4s.studio.test.heap=5g -Deyes4s.studio.fx.visible=true studioDesktop/test

  studio-clean-clone:
    name: Studio pins from a clean clone
    strategy:
      matrix:
        os: [ubuntu-22.04]
        java: [temurin@25]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout current branch (full)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Setup Java (temurin@25)
        id: setup-java-temurin-25
        if: matrix.java == 'temurin@25'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: sbt

      - name: sbt update
        if: matrix.java == 'temurin@25' && steps.setup-java-temurin-25.outputs.cache-hit == 'false'
        run: sbt +update

      - name: Publish the scaladock and Intaglio pins
        run: bash studio/publish-pins.sh

      - name: Build studio through the local-checkout override
        run: sbt -J-Xmx6g -Djavafx.platform=linux -Dstudio.intaglio.local=target/studio-pins/intaglio-edcdfd5ffaf010e8205da04a85a7f8b6b2fd0d92 -Dstudio.scaladock.local=target/studio-pins/scaladock-628c46fce92c4d31b0b08459ac0f18777b5ba527 studioVizJVM/test studioVizJS/test studioDesktop/Test/compile studioDesktop/checkModuleBoundaries
