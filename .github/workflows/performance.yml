# This file is generated by the githubWorkflowGenerate task in build.sbt.
# Do not edit it directly.

name: EyeLink Performance

on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: eyelink-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scheduled:
    name: Scheduled bounded-memory court
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout current revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: sbt

      - name: Record source identity
        shell: bash
        run: |
          echo "SOURCE_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git archive HEAD | shasum -a 256 | awk '{print "SOURCE_DIGEST=" $1}' >> "$GITHUB_ENV"

      - name: Run two-hour EyeLink performance court
        run: >-
          sbt "ioJVM/Test/runMain eyes4s.io.EyeLinkAscPerformanceMain
          --profile scheduled
          --source-revision $SOURCE_REVISION
          --source-digest $SOURCE_DIGEST
          --source-dirty false
          --hardware github-hosted-ubuntu-22.04-x64
          --output target/eyelink-performance-scheduled.tsv"

      - name: Upload measured validation rows
        uses: actions/upload-artifact@v4
        with:
          name: eyelink-performance-${{ github.sha }}
          path: target/eyelink-performance-scheduled.tsv
          if-no-files-found: error
