version = "3.11.4"
runner.dialect = scala3

maxColumn = 96

# The codebase uses significant indentation and `end` markers sparingly; keep
# scalafmt from rewriting between brace and indent styles.
rewrite.scala3.convertToNewSyntax = false
rewrite.scala3.removeOptionalBraces = false

align.preset = more
align.multiline = false

docstrings.style = SpaceAsterisk
docstrings.wrap = no

project.excludeFilters = ["target/"]
